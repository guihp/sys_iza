# A rede `interna` aponta para a rede onde n8n e Evolution já rodam.
# Confirmar o nome real com `docker network ls` na VPS antes do primeiro deploy
# e ajustar `name:` abaixo.
#
# Os `args` de build abaixo são interpolados pelo próprio Compose, que lê o `.env`
# do diretório deste arquivo — e não o `env_file` dos serviços. Na VPS, rode:
#   docker compose --env-file ../app/.env up -d --build
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      # Inlinadas no bundle em build time — ver comentário no Dockerfile.web.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?defina no .env ao lado do compose.yml}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?defina no .env ao lado do compose.yml}
    env_file: ../app/.env
    ports: ["3000:3000"]
    restart: unless-stopped
    networks: [interna]
  worker:
    build: { context: .., dockerfile: docker/Dockerfile.worker }
    env_file: ../app/.env
    restart: unless-stopped
    networks: [interna]

networks:
  interna:
    external: true
    name: n8n_default
