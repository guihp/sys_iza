# Deploy do sistema da Clínica Izadora — dois serviços a partir deste repositório.
#
# Este arquivo fica na raiz de propósito: é onde o Coolify procura por padrão, e
# é o que faz o contexto de build ser o repositório inteiro (o Dockerfile.web
# copia de `app/`, então o contexto precisa enxergar essa pasta).
#
# As variáveis abaixo vêm do painel do Coolify (aba Environment Variables). Nada
# de arquivo .env no servidor: o Coolify injeta na hora do build e do run.
# Veja DEPLOY.md para o passo a passo e a lista completa de variáveis.

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # NEXT_PUBLIC_* é inlinada no bundle em BUILD TIME pelo Turbopack. Passar
      # só como variável de runtime deixa `undefined` compilado dentro da
      # imagem, e o client do Supabase quebra no browser. Por isso vira ARG.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?obrigatoria}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?obrigatoria}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?obrigatoria}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?obrigatoria}
      SUPABASE_URL: ${SUPABASE_URL:?obrigatoria}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?obrigatoria}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?obrigatoria}
      EVOLUTION_URL: ${EVOLUTION_URL:?obrigatoria}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?obrigatoria}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:?obrigatoria}
      RESEND_API_KEY: ${RESEND_API_KEY:?obrigatoria}
      EMAIL_FROM: ${EMAIL_FROM:?obrigatoria}
      APP_TZ: ${APP_TZ:-America/Sao_Paulo}
      # Opcionais — vazias desligam o recurso (ver DEPLOY.md). Sem estas
      # linhas o Coolify não injeta no container mesmo que estejam no painel.
      META_DATASET_ID: ${META_DATASET_ID:-}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN:-}
      META_WHATSAPP_BUSINESS_ACCOUNT_ID: ${META_WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      META_ADS_TOKEN: ${META_ADS_TOKEN:-}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
    # `expose` e não `ports`: quem publica para a internet é o proxy do Coolify,
    # com o domínio configurado no painel. Publicar na porta do host aqui só
    # abriria o app direto, por fora do TLS.
    expose:
      - "3000"
    healthcheck:
      # /login é público e não depende de sessão. Usa o `node` da imagem (fetch
      # nativo) em vez de wget — node:alpine nem sempre traz wget/busybox wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks: [interna]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?obrigatoria}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?obrigatoria}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?obrigatoria}
      EVOLUTION_URL: ${EVOLUTION_URL:?obrigatoria}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?obrigatoria}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:?obrigatoria}
      RESEND_API_KEY: ${RESEND_API_KEY:?obrigatoria}
      EMAIL_FROM: ${EMAIL_FROM:?obrigatoria}
      APP_TZ: ${APP_TZ:-America/Sao_Paulo}
      META_DATASET_ID: ${META_DATASET_ID:-}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN:-}
      META_WHATSAPP_BUSINESS_ACCOUNT_ID: ${META_WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
    # O worker trata SIGTERM esperando o ciclo em andamento terminar. 30s é
    # folgado para isso e fica acima do limite interno de 20s dele.
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [interna]

networks:
  # Rede gerenciada pelo compose (Coolify cria no deploy). Não depende de uma
  # rede externa pré-existente — o default antigo `n8n_default` + external
  # quebrava o deploy se essa rede não existisse no host.
  #
  # Para o app falar com Evolution/n8n na mesma VPS, coloque esses serviços
  # nesta rede (`clinica-iza`) ou conecte os containers depois — ver DEPLOY.md.
  interna:
    name: clinica-iza
